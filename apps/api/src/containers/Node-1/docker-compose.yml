version: '3.8'
services:
  bootnode:
    image: hyperledger/besu:latest
    container_name: bootnode
    volumes:
      - ./data:/data
      - ../genesis.json:/genesis.json
    ports:
      - "30303:30303" 
      - "8545:8545"   
      - "8546:8546"   
    command:
      # General settings
      - --data-path=/data
      - --genesis-file=/genesis.json
      - --profile=ENTERPRISE
      
      # P2P settings
      - --p2p-port=30303
      - --p2p-host=0.0.0.0

      # RPC HTTP settings
      - --rpc-http-enabled
      - --rpc-http-api=ETH,NET,QBFT
      - --rpc-http-port=8545
      - --rpc-http-host=0.0.0.0
      - --rpc-http-cors-origins="all"

      # RPC WebSocket settings
      - --rpc-ws-enabled
      - --rpc-ws-host=0.0.0.0
      - --rpc-ws-port=8546

      # Host allowlist
      - --host-allowlist="*"
      
    networks:
      besu-network:
        ipv4_address: 192.168.1.100

networks:
  besu-network:
    external: true
