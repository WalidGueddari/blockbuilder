version: '3.6'

services:
  blockscout:
    image: ghcr.io/blockscout/blockscout:latest
    container_name: blockscout-NET_ID
    restart: always
    environment:
      - PORT=4000
      - ECTO_USE_SSL=false
      - DATABASE_URL=postgresql://postgres:postgres@192.168.1.151:5432/postgres?ssl=false
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - CHAIN_ID=CHAINID_PlACEHOLDER
      - COIN=ETH
      - ETHEREUM_JSONRPC_VARIANT=besu
      - ETHEREUM_JSONRPC_TRANSPORT=http
      - ETHEREUM_JSONRPC_HTTP_URL=http://DNS_PLACEHOLDER
      - ETHEREUM_JSONRPC_TRACE_URL=http://DNS_PLACEHOLDER
      - ETHEREUM_JSONRPC_WS_URL=ws://DNS_PLACEHOLDER
      - ACCOUNT_REDIS_URL=redis://redis-db:6379
    command: sh -c "bin/blockscout eval \"Elixir.Explorer.ReleaseTasks.create_and_migrate()\" && bin/blockscout start"
    depends_on:
      blockscoutpostgres:
        condition: service_healthy
      redis-db:
        condition: service_started
    links:
      - blockscoutpostgres
      - redis-db
    ports:
      - 26000:4000
    networks:
      blockscout_network:
        ipv4_address: 192.168.1.150

  blockscoutpostgres:
    image: postgres:13.6-alpine
    restart: "on-failure"
    container_name: blockscoutpostgres-NET_ID
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - blockscoutpostgres:/var/lib/postgresql/data
    ports:
      - 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 10s
      retries: 5
    networks:
      blockscout_network:
        ipv4_address: 192.168.1.151

  redis-db:
    image: redis:alpine
    container_name: redis-NET_ID
    restart: always
    networks:
      blockscout_network:
        ipv4_address: 192.168.1.152

  frontend:
    image: ghcr.io/blockscout/frontend:latest
    container_name: frontend-NET_ID
    restart: always
    environment:
      - NEXT_PUBLIC_API_HOST=http://DNS_PLACEHOLDER
      - NEXT_PUBLIC_APP_HOST=http://DNS_PLACEHOLDER
      - NEXT_PUBLIC_NETWORK_NAME=BlockBuilder
      - NEXT_PUBLIC_NETWORK_ID=CHAINID_PlACEHOLDER
    ports:
      - 3000:3000
    depends_on:
      - blockscout
    networks:
      blockscout_network:
        ipv4_address: 192.168.1.153

volumes:
  blockscoutpostgres:

networks:
  blockscout_network:
    external: true
